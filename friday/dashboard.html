<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Friday</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a25;--bg4:#222230;
  --text:#e8e8f0;--text2:#9090a8;--text3:#606078;
  --accent:#6366f1;--accent2:#818cf8;--accent3:#4f46e5;
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;
  --border:#2a2a3a;--radius:12px;--radius-sm:8px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.header h1 span{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-stats{display:flex;gap:8px}
.pill{font-size:10px;padding:3px 8px;border-radius:12px;background:var(--bg3);color:var(--text2)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:16px}
.view.active{display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-h{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.card-b{padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg3);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat .v{font-size:24px;font-weight:700;color:var(--accent2)}
.stat .l{font-size:10px;color:var(--text3);margin-top:2px;text-transform:uppercase}
.goal-row{display:flex;gap:8px}
.goal-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;color:var(--text);font-size:14px;outline:none}
.goal-input:focus{border-color:var(--accent)}
.goal-input::placeholder{color:var(--text3)}
.goal-btn{background:var(--accent);border:none;border-radius:var(--radius-sm);padding:12px 16px;color:#fff;font-weight:600;cursor:pointer;font-size:14px}
.goal-btn:active{transform:scale(.97)}
.goal-btn:disabled{opacity:.5}
.qactions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qbtn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;cursor:pointer;font-size:12px}
.qbtn:active{background:var(--bg4)}
.qbtn .ico{font-size:18px;display:block;margin-bottom:2px}
.goal-list{display:flex;flex-direction:column;gap:6px}
.goal-item{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.goal-g{font-size:13px;margin-bottom:4px}
.goal-m{display:flex;gap:8px;font-size:11px;color:var(--text3);align-items:center}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.badge.running{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge.completed{background:rgba(34,197,94,.15);color:var(--green)}
.badge.error{background:rgba(239,68,68,.15);color:var(--red)}
.badge.pending{background:rgba(99,102,241,.15);color:var(--accent2)}
.badge.planning{background:rgba(59,130,246,.15);color:var(--blue)}
.badge.executing{background:rgba(234,179,8,.15);color:var(--yellow)}
.steps{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.step{display:flex;gap:6px;font-size:11px;font-family:monospace;padding:4px 8px;background:var(--bg4);border-radius:4px}
.step .s-prim{color:var(--accent2);min-width:100px}
.step .s-stat{flex:1}
.step .s-err{color:var(--red);font-size:10px}
.trig{display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg3);border-radius:var(--radius-sm);margin-bottom:4px}
.trig-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.trig-dot.on{background:var(--green)}.trig-dot.off{background:var(--text3)}
.trig-n{font-size:12px;flex:1}.trig-s{font-size:10px;color:var(--text3)}
.mem-row{display:flex;gap:6px;margin-bottom:8px}
.mem-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:12px;outline:none}
.mem-input:focus{border-color:var(--accent)}
.mem-btn{background:var(--accent);border:none;border-radius:var(--radius-sm);padding:8px 12px;color:#fff;font-size:12px;cursor:pointer}
.mem-item{background:var(--bg3);border-radius:var(--radius-sm);padding:8px;margin-bottom:4px}
.mem-k{font-size:11px;font-weight:600;color:var(--accent2)}
.mem-v{font-size:11px;color:var(--text2)}
.mem-c{font-size:9px;color:var(--text3)}
.log-item{display:flex;gap:6px;padding:5px 8px;background:var(--bg3);border-radius:4px;font-size:11px;font-family:monospace;margin-bottom:3px}
.log-t{color:var(--text3);flex-shrink:0;width:60px}
.log-p{color:var(--accent2);min-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-r{color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-e{color:var(--red)}
.empty{text-align:center;padding:20px;color:var(--text3);font-size:12px}
.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:10px 0;text-align:center;font-size:11px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:var(--bg4);color:var(--text);padding:8px 16px;border-radius:16px;font-size:12px;border:1px solid var(--border);opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div class="header">
  <h1><div class="dot"></div><span>Friday</span></h1>
  <div class="hdr-stats">
    <div class="pill" id="hPrims">-- prims</div>
    <div class="pill" id="hTasks">-- tasks</div>
  </div>
</div>
<div class="main">
  <div class="view active" id="vGoal">
    <div class="card">
      <div class="card-h">Execute Goal</div>
      <div class="card-b">
        <div class="goal-row">
          <input class="goal-input" id="gIn" placeholder="What do you want to do?" autofocus>
          <button class="goal-btn" id="gBtn" onclick="runGoal()">Go</button>
        </div>
      </div>
    </div>
    <div class="qactions">
      <div class="qbtn" onclick="quick('take a screenshot and describe it')"><span class="ico">📸</span>Screenshot</div>
      <div class="qbtn" onclick="quick('show me my calendar for today')"><span class="ico">📅</span>Calendar</div>
      <div class="qbtn" onclick="quick('check my unread emails and summarize the latest one')"><span class="ico">📧</span>Email</div>
      <div class="qbtn" onclick="quick('pause whatever is playing')"><span class="ico">⏸️</span>Pause</div>
      <div class="qbtn" onclick="quick('show me system info')"><span class="ico">💻</span>System</div>
      <div class="qbtn" onclick="quick('read the clipboard')"><span class="ico">📋</span>Clipboard</div>
    </div>
    <div class="card">
      <div class="card-h">Goals <span id="goalCount"></span></div>
      <div class="card-b"><div class="goal-list" id="gList"><div class="empty">No goals yet</div></div></div>
    </div>
  </div>
  <div class="view" id="vTrig">
    <div class="card"><div class="card-h">Triggers</div><div class="card-b"><div id="tList"><div class="empty">Loading...</div></div></div></div>
  </div>
  <div class="view" id="vMem">
    <div class="card">
      <div class="card-h">Memory</div>
      <div class="card-b">
        <div class="mem-row"><input class="mem-input" id="mIn" placeholder="Search..." onkeydown="if(event.key==='Enter')searchMem()"><button class="mem-btn" onclick="searchMem()">Search</button></div>
        <div id="mList"><div class="empty">Search or leave empty for summary</div></div>
      </div>
    </div>
  </div>
  <div class="view" id="vLogs">
    <div class="card"><div class="card-h">Activity</div><div class="card-b"><div id="lList"><div class="empty">Loading...</div></div></div></div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="tab('vGoal',this)">Goals</div>
  <div class="tab" onclick="tab('vTrig',this)">Triggers</div>
  <div class="tab" onclick="tab('vMem',this)">Memory</div>
  <div class="tab" onclick="tab('vLogs',this)">Logs</div>
</div>
<div class="toast" id="toast"></div>

<script>
const API=location.origin;
let goals=[];
let pollers={};

function tab(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));el.classList.add('active');document.getElementById(id).classList.add('active');if(id==='vTrig')loadTrigs();if(id==='vMem')searchMem();if(id==='vLogs')loadLogs()}
function toast(m,d=2500){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
async function api(p,o={}){try{const r=await fetch(API+p,o);return await r.json()}catch(e){return null}}

// Run goal
async function runGoal(){
  const inp=document.getElementById('gIn');
  const goal=inp.value.trim();
  if(!goal)return;
  const btn=document.getElementById('gBtn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  inp.value='';
  const d=await api('/goal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal})});
  btn.disabled=false;btn.textContent='Go';
  if(d&&d.run_id){
    goals.unshift({run_id:d.run_id,goal,status:'pending',created_at:new Date().toISOString(),steps:[]});
    renderGoals();toast('Running...');
    pollGoal(d.run_id);
  }else{toast('Failed to submit goal')}
}
function quick(g){document.getElementById('gIn').value=g;runGoal()}

// Poll for goal result
function pollGoal(id){
  if(pollers[id])return;
  pollers[id]=setInterval(async()=>{
    const d=await api('/goal/'+id);
    if(!d)return;
    const g=goals.find(x=>x.run_id===id);
    if(g){Object.assign(g,d);renderGoals()}
    if(d.status==='completed'||d.status==='error'||d.status==='ABORTED'||d.status==='ERROR'){
      clearInterval(pollers[id]);delete pollers[id];
      toast(d.status==='completed'?'Done!':'Failed');
    }
  },2000);
}

// Render goals
function renderGoals(){
  const el=document.getElementById('gList');
  const c=document.getElementById('goalCount');
  c.textContent=goals.length?`(${goals.length})`:'';
  if(!goals.length){el.innerHTML='<div class="empty">No goals yet</div>';return}
  el.innerHTML=goals.map(g=>{
    const st=g.status||'pending';
    const stepsHtml=(g.steps&&g.steps.length)?`<div class="steps">${g.steps.map(s=>`<div class="step"><span class="s-prim">${esc(s.primitive||'')}</span><span class="s-stat">${s.status||''}${s.retries?' ('+s.retries+' retries)':''}</span>${s.error?`<span class="s-err">${esc(s.error.slice(0,80))}</span>`:''}</div>`).join('')}</div>`:'';
    const dur=g.duration_s?` · ${g.duration_s}s`:'';
    return `<div class="goal-item"><div class="goal-g">${esc(g.goal)}</div><div class="goal-m"><span class="badge ${st}">${st}</span><span>${dur}</span></div>${stepsHtml}</div>`;
  }).join('');
}

// Load goals on start
async function loadGoals(){
  const d=await api('/goals');
  if(d&&d.goals){goals=d.goals;renderGoals();goals.filter(g=>g.status==='running'||g.status==='pending'||g.status==='planning'||g.status==='executing').forEach(g=>pollGoal(g.run_id))}
}

// Status
async function loadStatus(){
  const d=await api('/status');
  if(!d)return;
  document.getElementById('hPrims').textContent=(d.primitives?.total||0)+' prims';
  document.getElementById('hTasks').textContent=(d.tasks?.passing||0)+' tasks';
}

// Triggers
async function loadTrigs(){
  const d=await api('/trigs');
  if(!d)d=await api('/triggers');
  const el=document.getElementById('tList');
  if(!d||!d.triggers){el.innerHTML='<div class="empty">Failed</div>';return}
  el.innerHTML=d.triggers.map(t=>`<div class="trig"><div class="trig-dot ${t.enabled?'on':'off'}"></div><div class="trig-n">${esc(t.id)}</div><div class="trig-s">${esc(t.schedule)}</div></div>`).join('');
}

// Memory
async function searchMem(){
  const q=document.getElementById('mIn').value.trim();
  const el=document.getElementById('mList');
  const d=await api('/memory'+(q?'?q='+encodeURIComponent(q):''));
  if(!d){el.innerHTML='<div class="empty">Failed</div>';return}
  if(q&&d.results){
    if(!d.results.length){el.innerHTML='<div class="empty">No results</div>';return}
    el.innerHTML=d.results.map(r=>`<div class="mem-item"><div class="mem-k">${esc(r.key)}</div><div class="mem-v">${esc(r.value)}</div><div class="mem-c">${r.category} · ${Math.round(r.relevance*100)}%</div></div>`).join('');
  }else if(d.total!==undefined){
    el.innerHTML=`<div class="empty">${d.total} memories</div>`+Object.entries(d.categories||{}).map(([k,v])=>`<div class="mem-item"><div class="mem-k">${k}</div><div class="mem-v">${v} entries</div></div>`).join('');
  }else{el.innerHTML='<div class="empty">Type to search</div>'}
}

// Logs
async function loadLogs(){
  const d=await api('/logs?n=40');
  const el=document.getElementById('lList');
  if(!d||!d.logs){el.innerHTML='<div class="empty">No logs</div>';return}
  el.innerHTML=d.logs.reverse().map(l=>`<div class="log-item"><span class="log-t">${(l.timestamp||'').slice(11,19)}</span><span class="log-p">${esc(l.primitive||'')}</span><span class="${l.error?'log-e':'log-r'}">${esc(l.error||l.result||'')}</span></div>`).join('');
}

document.getElementById('gIn').addEventListener('keydown',e=>{if(e.key==='Enter')runGoal()});
loadGoals();loadStatus();setInterval(loadStatus,30000);setInterval(loadGoals,10000);
</script>
</body>
</html>
