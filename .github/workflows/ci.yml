name: CI

# Consolidated 2026-08-17: the previous workflow ran pytest with coverage,
# downloaded the playwright chromium browser (the suite is hermetic - every
# side-effect boundary is mocked, so the browser is never needed), had a
# redundant windows test job, and its ruff format / mypy jobs had never
# actually passed. This version runs the checks the repo can actually
# satisfy, with the canonical test runner (`python -m unittest discover`,
# what gates/test_suite.py uses). ruff and mypy now pass locally; keep them
# green when changing code. gates/ is excluded from lint/format via
# pyproject.toml (proof scripts + archived LLM drafts are artifacts, not
# shipped code). pre-commit remains a local dev tool, not CI-enforced.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff format check
        run: ruff format . --check

      - name: Run ruff lint
        run: ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Run type checking
        run: mypy friday

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run the unit suite
        run: python -m unittest discover -s tests

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Verify package
        run: |
          pip install dist/*.whl
          python -c "import friday; print('Package imports successfully')"
