[project]
name = "friday"
version = "0.8.0"
description = "Friday V8 - layered desktop automation (L0 observability through L4 planning)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Lakshay Sharma", email = "lakshay@example.com"}
]
keywords = ["automation", "desktop", "LLM", "orchestration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "playwright>=1.49.0",
    "requests>=2.31.0",
    # Windows-port screenshot backend (2026-08-16): PIL.ImageGrab replaces
    # grim for capture on Windows; harmless on Linux.
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.12.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
friday = "friday.__main__:main"
friday-mcp = "friday.mcp_server:main"
friday-webhook = "friday.webhook_server:main"

[project.urls]
Homepage = "https://github.com/lakshay/Friday-V2"
Documentation = "https://github.com/lakshay/Friday-V2#readme"
Repository = "https://github.com/lakshay/Friday-V2.git"

[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["friday", "friday.l1", "friday.l2", "friday.l3", "friday.l4"]

# ------------------------------------------------------------ Ruff
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    # Proof scripts, gate/demo runners and archived LLM draft proposals -
    # artifacts, not shipped code (they never enter the installed package).
    "gates",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID",    # tidy imports
    "RET",    # return statement
    "RSE",    # raise error
    "PLC",    # pylint convention
    "PLE",    # pylint error
    "PLR",    # pylint refactor
    "PLW",    # pylint warning
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # line-length handled by formatter
    "PLR2004", # magic number
    # Deliberate codebase patterns (each documented where it occurs):
    "E402",    # gate-registered blocks append imports mid-module (files.py
               # find_newest, gmail.py send_document); see the registration
               # header comments
    "E741",    # ambiguous-name lint (tests use single-letter loop vars)
    "PLC0415", # local imports inside functions - circular-import avoidance
               # (screenshot._window_geometry, executor)
    "PLW0603", # module-level singletons via global (browser._pw, media._proc,
               # observability._RUN_ID, gmail/_token_cache)
    "PLW1510", # subprocess.run without check= - the primitives deliberately
               # inspect returncode and raise FridayError instead of
               # CalledProcessError (the gate's subprocess shapes)
    "RUF012",  # mutable class attributes used as test fixtures / registries
    "PLR0911",  # too many return statements - validator functions (planner
                 # validate_plan, automated_gate checks) are deliberately
                 # early-return-heavy
    "PLR0912", # too many branches - same validator functions
    "PLR0915", # too many statements - same validator functions
    "SIM105",   # try/except-pass vs contextlib.suppress - the two remaining
                 # sites (media.py wait/kill loops) have control flow in the
                 # try body, so the rewrite is not offered by ruff
    "SIM115",   # open() without context manager - the remaining site
                 # (media.py Popen stderr) deliberately keeps the fd open for
                 # the child process; the test sites ruff can fix are fixed
    "SIM117",   # nested with-statements - the test idiom
                 # `with mock.patch(...): with assertRaises(...) as ctx:`
                 # (ctx used after the block) has no autofix; rewriting ~25
                 # sites by hand for a style rule is not housekeeping
]

[tool.ruff.lint.isort]
known-first-party = ["friday"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"friday/__init__.py" = ["F401", "F811"]
"tests/**" = ["SLF001"]  # private-member-access

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-locals = 30
max-statements = 80

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ------------------------------------------------------------ MyPy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "PIL.*",
    "requests.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------ Pytest
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=friday",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["friday"]
branch = true
omit = [
    "friday/__main__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "type: ignore",
    "@overload",
]# ------------------------------------------------------------ Setuptools
# Package list is declared explicitly above ([tool.setuptools] packages =
# ["friday", ...]); no packages.find auto-discovery is used.
