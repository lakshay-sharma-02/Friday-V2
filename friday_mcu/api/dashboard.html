<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCU Friday — Dashboard</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a25;
            --border: #2a2a3a;
            --text: #e0e0e0;
            --text-dim: #888;
            --accent: #4f8fff;
            --accent2: #7c5cff;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
        }
        .header h1 { font-size: 24px; font-weight: 700; }
        .header h1 span { color: var(--accent); }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--success); display: inline-block; margin-right: 8px;
        }

        /* Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        /* Cards */
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px;
        }
        .card h3 { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .card .value { font-size: 32px; font-weight: 700; }
        .card .subtitle { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

        /* Goal Input */
        .goal-section { margin-bottom: 24px; }
        .goal-input-wrap {
            display: flex; gap: 12px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 12px; padding: 12px;
        }
        .goal-input {
            flex: 1; background: transparent; border: none; color: var(--text);
            font-size: 16px; outline: none;
        }
        .goal-input::placeholder { color: var(--text-dim); }
        .btn {
            background: var(--accent); color: white; border: none; border-radius: 8px;
            padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Goals List */
        .goals-list { max-height: 400px; overflow-y: auto; }
        .goal-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-bottom: 1px solid var(--border);
        }
        .goal-item:last-child { border-bottom: none; }
        .goal-status {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .goal-status.completed { background: var(--success); }
        .goal-status.running { background: var(--warning); animation: pulse 1s infinite; }
        .goal-status.failed, .goal-status.aborted { background: var(--error); }
        .goal-status.pending { background: var(--text-dim); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .goal-text { flex: 1; font-size: 14px; }
        .goal-time { font-size: 12px; color: var(--text-dim); white-space: nowrap; }

        /* Events Stream */
        .events-stream {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; max-height: 300px; overflow-y: auto;
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
        }
        .event-line { padding: 4px 0; border-bottom: 1px solid var(--border); }
        .event-line:last-child { border-bottom: none; }
        .event-type { color: var(--accent); font-weight: 600; }
        .event-source { color: var(--accent2); }
        .event-error { color: var(--error); }

        /* Adapters */
        .adapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
        .adapter-chip {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 8px; padding: 8px 12px; text-align: center;
            font-size: 12px;
        }
        .adapter-chip .name { font-weight: 600; margin-bottom: 4px; }
        .adapter-chip .caps { color: var(--text-dim); font-size: 10px; }

        /* Spinner */
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid var(--text-dim); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty state */
        .empty { text-align: center; color: var(--text-dim); padding: 40px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 <span>MCU Friday</span></h1>
            <div id="health-status">
                <span class="status-dot"></span> Connecting...
            </div>
        </div>

        <!-- Goal Input -->
        <div class="goal-section">
            <div class="goal-input-wrap">
                <input type="text" class="goal-input" id="goal-input"
                       placeholder="What do you need? (e.g., 'check my email', 'summarize unread emails')"
                       autocomplete="off">
                <button class="btn" id="run-btn" onclick="runGoal()">Run</button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid">
            <div class="card">
                <h3>Goals</h3>
                <div class="value" id="stat-goals">0</div>
                <div class="subtitle" id="stat-goals-sub">0 running, 0 completed</div>
            </div>
            <div class="card">
                <h3>Primitives</h3>
                <div class="value" id="stat-primitives">0</div>
                <div class="subtitle">registered contract-registered</div>
            </div>
        </div>

        <!-- Goals List + Events -->
        <div class="grid">
            <div class="card">
                <h3>Recent Goals</h3>
                <div class="goals-list" id="goals-list">
                    <div class="empty">No goals yet. Type one above!</div>
                </div>
            </div>
            <div class="card">
                <h3>Live Events</h3>
                <div class="events-stream" id="events-stream">
                    <div class="event-line">
                        <span class="event-type">SYSTEM</span> Waiting for events...
                    </div>
                </div>
            </div>
        </div>

        <!-- Adapters -->
        <div class="card" style="margin-bottom: 24px;">
            <h3>Adapters</h3>
            <div class="adapter-grid" id="adapters-grid">
                <div class="empty">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let ws = null;

        // ── Health Check
        async function checkHealth() {
            try {
                const res = await fetch(`${API}/health`);
                const data = await res.json();
                document.getElementById('health-status').innerHTML =
                    `<span class="status-dot"></span> v${data.version} — Connected`;
                return data;
            } catch (e) {
                document.getElementById('health-status').innerHTML =
                    `<span class="status-dot" style="background:var(--error)"></span> Disconnected`;
                return null;
            }
        }

        // ── Status
        async function loadStatus() {
            try {
                const res = await fetch(`${API}/v1/status`);
                const data = await res.json();
                document.getElementById('stat-goals').textContent = data.goals_total || 0;
                document.getElementById('stat-goals-sub').textContent =
                    `${data.goals_running || 0} running, ${data.primitives || 0} primitives`;
                document.getElementById('stat-primitives').textContent = data.primitives || 0;
            } catch (e) {}
        }

        // ── Goals
        async function loadGoals() {
            try {
                const res = await fetch(`${API}/v1/goals?limit=20`);
                const data = await res.json();
                const list = document.getElementById('goals-list');
                if (!data.goals || data.goals.length === 0) {
                    list.innerHTML = '<div class="empty">No goals yet. Type one above!</div>';
                    return;
                }
                list.innerHTML = data.goals.map(g => `
                    <div class="goal-item">
                        <div class="goal-status ${g.status || 'pending'}"></div>
                        <div class="goal-text">${escapeHtml(g.goal || '?')}</div>
                        <div class="goal-time">${formatTime(g.created_at)}</div>
                    </div>
                `).join('');
            } catch (e) {}
        }

        // ── Run Goal
        async function runGoal() {
            const input = document.getElementById('goal-input');
            const goal = input.value.trim();
            if (!goal) return;

            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            try {
                await fetch(`${API}/v1/goals`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({goal})
                });
                input.value = '';
                addEvent('GOAL_SUBMITTED', goal);
                setTimeout(loadGoals, 1000);
            } catch (e) {
                addEvent('ERROR', e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Run';
            }
        }

        // ── Adapters
        async function loadAdapters() {
            try {
                const res = await fetch(`${API}/v1/adapters`);
                const data = await res.json();
                const grid = document.getElementById('adapters-grid');
                const adapters = data.adapters || {};
                const names = Object.keys(adapters);
                if (names.length === 0) {
                    grid.innerHTML = '<div class="empty">No adapters registered</div>';
                    return;
                }
                grid.innerHTML = names.map(name => {
                    const a = adapters[name];
                    return `
                        <div class="adapter-chip">
                            <div class="name">${a.healthy ? '✓' : '✗'} ${name}</div>
                            <div class="caps">${(a.capabilities || []).slice(0, 3).join(', ')}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {}
        }

        // ── WebSocket Events
        function connectWS() {
            const wsUrl = API.replace('http', 'ws') + '/ws/events';
            ws = new WebSocket(wsUrl);
            ws.onmessage = (e) => {
                try {
                    const event = JSON.parse(e.data);
                    addEvent(event.type, JSON.stringify(event.data || {}).slice(0, 100));
                    // Refresh goals on relevant events
                    if (event.type && event.type.startsWith('goal.')) {
                        setTimeout(loadGoals, 500);
                    }
                } catch (err) {}
            };
            ws.onclose = () => setTimeout(connectWS, 3000);
            ws.onerror = () => ws.close();
        }

        // ── Events Display
        function addEvent(type, detail) {
            const stream = document.getElementById('events-stream');
            const line = document.createElement('div');
            line.className = 'event-line';
            line.innerHTML = `<span class="event-type">${escapeHtml(type)}</span> ${escapeHtml(detail)}`;
            stream.appendChild(line);
            if (stream.children.length > 50) stream.removeChild(stream.firstChild);
            stream.scrollTop = stream.scrollHeight;
        }

        // ── Helpers
        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
        function formatTime(ts) {
            if (!ts) return '';
            try {
                return new Date(ts).toLocaleTimeString();
            } catch { return ts; }
        }

        // ── Enter key
        document.getElementById('goal-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runGoal();
        });

        // ── Init
        async function init() {
            await checkHealth();
            await loadStatus();
            await loadGoals();
            await loadAdapters();
            connectWS();
        }
        init();
        setInterval(loadGoals, 10000);  // refresh goals every 10s
    </script>
</body>
</html>
