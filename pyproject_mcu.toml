[project]
name = "friday-mcu"
version = "1.0.0"
description = "MCU Friday — An AI that observes, infers, acts, learns, and communicates"
readme = "docs/MCU_FRIDAY_ARCHITECTURE.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Lakshay Sharma", email = "lakshay@example.com"}
]
keywords = ["AI", "automation", "desktop", "LLM", "orchestration", "friday"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
full = [
    "playwright>=1.49.0",
    "Pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.12.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
friday = "friday_mcu.demo:main"
friday-api = "friday_mcu.api.server:main"

[project.urls]
Homepage = "https://github.com/lakshay/Friday-V2"
Documentation = "https://github.com/lakshay/Friday-V2#readme"
Repository = "https://github.com/lakshay/Friday-V2.git"

[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["friday_mcu*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "__pycache__", "friday/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "PLW0603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "-q", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["friday_mcu"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
